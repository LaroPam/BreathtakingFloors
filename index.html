<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a12" />
    <title>Breathtaking Floors</title>
    <!-- PLATFORM_SDK -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0a12; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; outline: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #f4d27a; font: 600 14px/1.4 ui-monospace, monospace; letter-spacing: 0.2em; pointer-events: none; }
      #boot i { display: block; width: 120px; height: 4px; margin: 10px auto 0; background: #2a2438; }
      #boot b { display: block; height: 100%; width: 0; background: #f4d27a; transition: width 0.15s; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="boot"><div>LOADING<i><b id="bootbar"></b></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
